<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlumaViva · Bienestar Aviar · Prototipo v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* =====================================================================
   PlumaViva · Prototipo de evaluación de bienestar animal en aves
   Paleta verde del proyecto: Semilla #317330 · Cosecha #C6C309 ·
   Siembra #86B327 · Campo #048C38 · Tipografía: Nunito Sans
   ===================================================================== */
:root {
  --semilla: #317330; --cosecha: #C6C309; --siembra: #86B327; --campo: #048C38;
  --oro: #BD9C54; --musgo: #36543B; --petroleo: #285A5A; --vino: #8A3431; --navy: #2B3956;
  --gris: #737476; --gris-2: #A5A6A7; --linea: #DADDD8; --fondo: #F4F6F2; --blanco: #FFFFFF;
  --texto: #2E322F; --texto-2: #5F6461;
  --ok-bg: #E9F4E4; --warn-bg: #FBF8DC; --err-bg: #F6E7E6; --info-bg: #E7EEF2;
  --radio: 10px; --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Nunito Sans", "Segoe UI", Arial, sans-serif; color: var(--texto); background: var(--fondo); font-size: 15px; line-height: 1.45; }
a { color: var(--semilla); }
h1, h2, h3, h4 { margin: 0 0 .4em; color: var(--texto); font-weight: 800; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
.muted { color: var(--texto-2); } .small { font-size: .84rem; } .tiny { font-size: .76rem; }
.hidden { display: none !important; }

/* ---------- franja de prototipo ---------- */
.proto-banner { background: var(--musgo); color: #fff; font-size: .78rem; text-align: center; padding: 4px 10px; letter-spacing: .2px; }

/* ---------- barra superior ---------- */
.topbar { height: 64px; background: var(--blanco); display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 4px solid var(--siembra); position: sticky; top: 0; z-index: 20; }
.topbar .logo { height: 40px; }
.topbar .sep { width: 1px; height: 34px; background: var(--linea); }
.topbar .app-name { font-weight: 800; color: var(--semilla); line-height: 1.1; }
.topbar .app-name small { display: block; font-weight: 600; color: var(--gris); font-size: .78rem; }
.topbar .spacer { flex: 1; }
.icon-btn { position: relative; border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--gris); }
.icon-btn:hover { background: var(--fondo); }
.badge { position: absolute; top: 4px; right: 4px; background: var(--vino); color: #fff; font-size: .65rem; font-weight: 800; border-radius: 9px; padding: 1px 5px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 24px; background: var(--fondo); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--semilla); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.user-chip b { display: block; font-size: .86rem; } .user-chip span { font-size: .74rem; color: var(--gris); }

/* ---------- estructura ---------- */
.layout { display: grid; grid-template-columns: 248px 1fr; min-height: calc(100vh - 92px); }
.sidebar { background: var(--semilla); color: #fff; padding: 18px 12px; }
.sidebar .grp { font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; opacity: .7; margin: 14px 12px 6px; }
.sidebar a { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 700; font-size: .93rem; }
.sidebar a:hover { background: rgba(255,255,255,.1); }
.sidebar a.active { background: var(--siembra); color: #fff; }
.sidebar svg { width: 18px; height: 18px; flex: none; }
.content { padding: 24px 28px 60px; max-width: 1280px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 0; }
.crumbs { font-size: .8rem; color: var(--gris); margin-bottom: 4px; }
.crumbs a { color: var(--gris); }

/* ---------- tarjetas y rejillas ---------- */
.card { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding: 18px 20px; margin-bottom: 18px; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px 18px; border-left: 5px solid var(--siembra); }
.kpi .v { font-size: 1.9rem; font-weight: 900; color: var(--semilla); line-height: 1.1; }
.kpi .l { color: var(--texto-2); font-size: .84rem; font-weight: 700; }
.kpi.alt { border-left-color: var(--vino); } .kpi.alt .v { color: var(--vino); }
.kpi.oro { border-left-color: var(--oro); }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--semilla); background: var(--semilla); color: #fff; font: inherit; font-weight: 800; font-size: .9rem;
       padding: 9px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--musgo); border-color: var(--musgo); }
.btn.sec { background: #fff; color: var(--semilla); } .btn.sec:hover { background: var(--ok-bg); }
.btn.lime { background: var(--siembra); border-color: var(--siembra); }
.btn.danger { background: #fff; color: var(--vino); border-color: var(--vino); } .btn.danger:hover { background: var(--err-bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--semilla); padding: 6px 8px; }
.btn.sm { padding: 5px 10px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-help { background: var(--navy); border-color: var(--navy); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: .78rem; }
.btn-help:hover { background: #1f2a40; }

/* ---------- formularios ---------- */
.form { display: grid; gap: 14px 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form.one { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-weight: 800; font-size: .84rem; color: var(--texto); }
.field .hint { font-size: .76rem; color: var(--gris); }
.field .err { font-size: .76rem; color: var(--vino); font-weight: 700; }
input, select, textarea { font: inherit; font-size: .92rem; padding: 9px 11px; border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; color: var(--texto); width: 100%; }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(134,179,39,.35); border-color: var(--siembra); }
input[readonly], .calc { background: var(--ok-bg); color: var(--semilla); font-weight: 800; border-color: #cfe3c6; }
input.invalid { border-color: var(--vino); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: .9rem; padding: 4px 0; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--semilla); flex: none; }
.radio-row { display: flex; gap: 8px; flex-wrap: wrap; }
.radio-row label { display: flex; gap: 6px; align-items: center; padding: 7px 12px; border: 1.5px solid var(--linea); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .86rem; }
.radio-row input { width: auto; accent-color: var(--semilla); }
.radio-row label:has(input:checked) { border-color: var(--semilla); background: var(--ok-bg); color: var(--semilla); }
.pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: var(--gris); font-weight: 800; font-size: .78rem; }

/* ---------- tablas ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; background: var(--semilla); color: #fff; font-weight: 800; padding: 9px 10px; font-size: .8rem; white-space: nowrap; }
th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
tr:hover td { background: #FAFBF8; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- etiquetas ---------- */
.tag { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
.t-ok { background: var(--ok-bg); color: var(--semilla); } .t-warn { background: var(--warn-bg); color: #7c6f05; }
.t-err { background: var(--err-bg); color: var(--vino); } .t-gray { background: #EEEFEE; color: var(--gris); } .t-info { background: var(--info-bg); color: var(--navy); }
.lvl { display: inline-block; padding: 3px 12px; border-radius: 14px; font-weight: 900; font-size: .8rem; letter-spacing: .3px; color: #fff; }
.lvl.EXCELENTE { background: var(--campo); } .lvl.ALTO { background: var(--siembra); } .lvl.MEDIO { background: var(--cosecha); color: #3b3a02; } .lvl.BAJO { background: var(--vino); }

/* ---------- avisos ---------- */
.alert { border-radius: 8px; padding: 10px 14px; font-size: .88rem; margin: 8px 0; border-left: 4px solid; }
.alert.ok { background: var(--ok-bg); border-color: var(--semilla); } .alert.warn { background: var(--warn-bg); border-color: var(--cosecha); }
.alert.err { background: var(--err-bg); border-color: var(--vino); } .alert.info { background: var(--info-bg); border-color: var(--navy); }

/* ---------- login ---------- */
.auth { min-height: calc(100vh - 26px); display: grid; grid-template-columns: 1.05fr 1fr; }
.auth-side { background: var(--semilla); color: #fff; padding: 56px 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-side h1 { color: #fff; font-size: 2.1rem; line-height: 1.15; max-width: 480px; }
.auth-side p { color: #E7F1DE; max-width: 460px; }
.auth-side .stripe { position: absolute; right: -60px; bottom: -60px; width: 340px; height: 340px; background:
  linear-gradient(45deg, rgba(134,179,39,.55) 25%, transparent 25%, transparent 50%, rgba(198,195,9,.45) 50%, rgba(198,195,9,.45) 75%, transparent 75%);
  background-size: 68px 68px; transform: rotate(12deg); opacity: .55; border-radius: 30px; }
.auth-main { display: grid; place-items: center; padding: 30px; background: #fff; }
.auth-box { width: 100%; max-width: 420px; }
.auth-box .logo { height: 58px; margin-bottom: 22px; }
.demo-users { margin-top: 18px; border: 1.5px dashed var(--linea); border-radius: 10px; padding: 12px 14px; }
.demo-users button { margin: 3px 4px 3px 0; }
.code-input { display: flex; gap: 8px; } .code-input input { text-align: center; font-size: 1.4rem; font-weight: 900; padding: 10px 0; }
.req li { list-style: none; font-size: .85rem; padding: 2px 0; } .req { padding-left: 0; }
.req li.ok { color: var(--semilla); font-weight: 800; } .req li.no { color: var(--gris); }
.mailbox { background: var(--info-bg); border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: .85rem; }

/* ---------- gráficas ---------- */
.bars { display: flex; align-items: flex-end; gap: 22px; height: 190px; padding: 10px 6px 0; border-bottom: 2px solid var(--gris-2); }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bars .col { width: 100%; max-width: 74px; border-radius: 6px 6px 0 0; }
.bars .v { font-weight: 900; font-size: .9rem; margin-bottom: 4px; }
.bars-lab { display: flex; gap: 22px; padding: 6px 6px 0; } .bars-lab span { flex: 1; text-align: center; font-weight: 800; font-size: .82rem; }
.hbar { display: grid; grid-template-columns: 150px 1fr 56px; gap: 10px; align-items: center; margin: 8px 0; font-size: .88rem; font-weight: 700; }
.hbar .track { height: 12px; background: #E6E9E3; border-radius: 6px; overflow: hidden; } .hbar .fill { height: 100%; background: var(--siembra); border-radius: 6px; }

/* ---------- pestañas y pasos ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--linea); margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; font: inherit; font-weight: 800; color: var(--gris); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--semilla); border-color: var(--siembra); }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.step { flex: 1; min-width: 118px; background: #fff; border-radius: 8px; padding: 9px 10px; box-shadow: var(--sombra); cursor: pointer; border-top: 4px solid var(--linea); }
.step b { display: block; font-size: .8rem; } .step span { font-size: .72rem; color: var(--gris); }
.step.on { border-top-color: var(--siembra); } .step.done { border-top-color: var(--semilla); } .step.on b { color: var(--semilla); }
.statusbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; box-shadow: var(--sombra); font-size: .84rem; }

/* ---------- indicador ---------- */
.ind { border: 1.5px solid var(--linea); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
.ind.na { opacity: .55; background: #FAFAFA; }
.ind-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.ind-head h3 { margin: 0; } .ind-head .meta { font-size: .78rem; color: var(--gris); }
.ind-res { text-align: right; min-width: 90px; } .ind-res .p { font-size: 1.3rem; font-weight: 900; color: var(--semilla); }
.seg { display: inline-flex; border: 1.5px solid var(--linea); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--linea); background: #fff; font: inherit; font-weight: 800; font-size: .82rem; padding: 7px 12px; cursor: pointer; color: var(--texto-2); }
.seg button:last-child { border-right: 0; }
.seg button.s2.on { background: var(--campo); color: #fff; } .seg button.s1.on { background: var(--cosecha); color: #333; } .seg button.s0.on { background: var(--vino); color: #fff; }
.units { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.unit { min-width: 46px; border: 1.5px solid var(--linea); border-radius: 8px; text-align: center; cursor: pointer; padding: 3px 6px; user-select: none; background: #fff; }
.unit small { display: block; font-size: .64rem; color: var(--gris); } .unit b { font-size: 1.05rem; }
.unit.v2 { background: var(--campo); border-color: var(--campo); color: #fff; } .unit.v1 { background: var(--cosecha); border-color: var(--cosecha); }
.unit.v0 { background: var(--vino); border-color: var(--vino); color: #fff; } .unit.v2 small, .unit.v0 small { color: #f2f2f2; }
.muestra { margin: 10px 0 2px; padding: 7px 11px; background: var(--info-bg); border-radius: 8px; font-size: .82rem; color: var(--texto); }
.ilus { margin-top: 8px; } .ilus summary { cursor: pointer; font-weight: 800; color: var(--semilla); font-size: .85rem; }
.grp-block { border-left: 4px solid var(--siembra); padding: 2px 0 6px 12px; margin-top: 12px; }
.grp-head { display: flex; gap: 6px; align-items: center; font-size: .9rem; } .grp-head .grp-pct { margin-left: auto; font-weight: 800; color: var(--semilla); }
.ind-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--linea); }
.legend-scale { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; font-size: .78rem; }
.legend-scale div { border-radius: 6px; padding: 6px 8px; } .ls2 { background: var(--ok-bg); } .ls1 { background: var(--warn-bg); } .ls0 { background: var(--err-bg); }

/* ---------- galpón (Ilustración 2) ---------- */
.galpon { border: 3px solid var(--gris); border-radius: 12px; padding: 18px 24px 26px; position: relative; max-width: 520px; background: #FAFBF8; }
.galpon .row { display: flex; justify-content: space-around; margin: 14px 0; }
.galpon .pt { width: 40px; height: 40px; border-radius: 50%; background: var(--semilla); color: #fff; display: grid; place-items: center; font-weight: 900; }
.galpon .door { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 90px; height: 12px; background: var(--oro); border-radius: 3px; }
.galpon .lab { position: absolute; top: 6px; left: 12px; font-size: .74rem; color: var(--gris); }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(20,30,20,.45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 680px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; }
.modal header h2 { margin: 0; }
.modal .body { padding: 18px 20px; } .modal footer { padding: 14px 20px; border-top: 1px solid var(--linea); display: flex; justify-content: flex-end; gap: 10px; }
.toast { position: fixed; right: 22px; bottom: 22px; background: var(--musgo); color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: var(--sombra); z-index: 60; max-width: 380px; font-weight: 700; font-size: .9rem; }

/* ---------- resultado ---------- */
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.score .big { font-size: 3rem; font-weight: 900; color: var(--semilla); line-height: 1; }
.list-clean { list-style: none; padding: 0; margin: 0; } .list-clean li { padding: 6px 0; border-bottom: 1px solid var(--linea); font-size: .9rem; }
.footer-note { text-align: center; color: var(--gris); font-size: .76rem; padding: 18px; }

/* ---------- acta (impresión) ---------- */
@media print {
  .tabs, .proto-banner, .topbar, .sidebar, .steps, .statusbar, .no-print, .toast { display: none !important; }
  .layout { display: block; } .content { padding: 0; } .card { box-shadow: none; border: 1px solid #ccc; }
  body { background: #fff; }
}
@media (max-width: 980px) {
  .user-chip > div:last-child, .app-name small { display: none; } .user-chip { padding: 2px; }
  .layout { grid-template-columns: 1fr; } .sidebar { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; } .sidebar .grp { display: none; }
  .g4 { grid-template-columns: repeat(2, 1fr); } .g3, .g2, .form { grid-template-columns: 1fr; } .auth { grid-template-columns: 1fr; } .auth-side { display: none; }
  .topbar .app-name small { display: none; }
}

/* ---------- PlumaViva v3 · importancia, recomendaciones y resumen de unidad ---------- */
.imp { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 12px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
.imp .dots { letter-spacing: 1px; font-size: .62rem; }
.imp.i4 { background: #F6E7E6; color: var(--vino); } .imp.i3 { background: #F7EEDB; color: #7a5a14; } .imp.i2 { background: var(--info-bg); color: var(--navy); } .imp.i1 { background: #EEEFEE; color: var(--gris); }
.rec { border: 1.5px solid var(--linea); border-left-width: 6px; border-radius: 10px; padding: 12px 16px; margin: 10px 0; background: #fff; }
.rec.p1 { border-left-color: var(--vino); } .rec.p2 { border-left-color: var(--cosecha); } .rec.p3 { border-left-color: var(--petroleo); } .rec.p4 { border-left-color: var(--gris-2); }
.rec-h { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; justify-content: space-between; margin-bottom: 6px; }
.rec-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .rec-pct { text-align: right; min-width: 130px; }
.rec-acts { margin: 6px 0 4px; padding-left: 20px; font-size: .88rem; } .rec-acts li { margin: 3px 0; }
.chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 9px; border-radius: 12px; background: var(--fondo); border: 1px solid var(--linea); font-size: .76rem; font-weight: 700; }
select[data-imp] { padding: 6px 8px; font-size: .84rem; }


/* ---------- v4 · plan de mejora, seguimiento y asistente ---------- */
.rec-foot { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--linea); font-size: .78rem; color: var(--texto-2); }
.prio-sum { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 10px; }
.res-grid { display: grid; grid-template-columns: 1.1fr 1.3fr 1.2fr; gap: 18px; align-items: start; }
.res-kpis { list-style: none; margin: 0; padding: 0; font-size: .86rem; display: grid; gap: 5px; }
.res-kpis li { padding: 5px 9px; border-radius: 8px; background: var(--fondo); }
.top-acts { margin: 0; padding-left: 20px; display: grid; gap: 8px; } .top-acts li .small { margin-top: 2px; }
.prog { height: 7px; border-radius: 6px; background: var(--linea); overflow: hidden; width: 120px; margin: 3px 0 2px; } .prog i { display: block; height: 100%; background: var(--siembra); }
details > summary { cursor: pointer; color: var(--semilla); }
details.card > summary { list-style-position: inside; }
.gal-sug td { background: var(--ok-bg); }

/* asistente: botón flotante, panel y página */

    <p class="tiny muted">Solo se muestran especies activas de la plataforma. Cada sistema carga su propia lista de chequeo.</p></div>
  <div class="card"><div class="card-head"><h2>4. Galpones / corrales e inventario</h2><button type="button" class="btn sec sm" data-act="addGalpon">+ Agregar galpón o corral</button></div>
    <div class="table-wrap" id="galBox"></div>

  </form>`, "unidades");
  const fillMun = () => { const d = $("#fDep").value; $("#fMun").innerHTML = DEPTOS[d].map(m => `<option ${base.mun === m ? "selected" : ""}>${m}</option>`).join(""); };
  $("#fDep").onchange = fillMun; fillMun();
  propBox(); $("#fProp").onchange = () => propBox();
  const coordBox = () => {
    const s = $("#fU").coordSis.value; base.coordSis = s;
    if (s === "GEO") $("#coordBox").innerHTML = `<div class="form"><div class="field"><label>Latitud</label><input id="cLat" type="number" step="0.00001" value="${esc(base.lat ?? "")}"></div>
      <div class="field"><label>Longitud</label><input id="cLon" type="number" step="0.00001" value="${esc(base.lon ?? "")}"></div>
      <div class="field full"><div class="btn-row"><button type="button" class="btn sec sm" data-act="gps">📍 Tomar ubicación del dispositivo</button><span class="hint" id="cMsg">Rango válido en Colombia: latitud −4,3 a 13,5 · longitud −82 a −66,8</span></div></div></div>`;
    if (s === "CART") $("#coordBox").innerHTML = `<div class="form"><div class="field"><label>X (Este, m)</label><input id="cX" type="number" value="4876512"></div><div class="field"><label>Y (Norte, m)</label><input id="cY" type="number" value="2051330"></div>
      <div class="field full"><span class="hint">Origen Nacional CTM12 (EPSG 9377). La conversión a geográficas la hace el servidor.</span></div></div>`;
    if (s === "POLAR") $("#coordBox").innerHTML = `<div class="form"><div class="field"><label>Punto de referencia</label><input value="Escuela de la vereda"></div><div class="field"><label>X0 · Y0 del punto (m)</label><input id="pX0" value="4876000, 2051000"></div>
      <div class="field"><label>Distancia d (m)</label><input id="pD" type="number" value="850"></div><div class="field"><label>Azimut (°)</label><input id="pAz" type="number" value="72"></div>
      <div class="field full"><label>Resultado (X = X0 + d·sen az · Y = Y0 + d·cos az)</label><input id="pRes" readonly></div></div>`;

        $("#pRes").value = d > 0 && Number($("#pAz").value) >= 0 && Number($("#pAz").value) < 360 ? `X ${int(Math.round(x0 + d * Math.sin(az)))} · Y ${int(Math.round(y0 + d * Math.cos(az)))}` : "Distancia > 0 y azimut entre 0 y 360°"; };
      ["pX0", "pD", "pAz"].forEach(i => $("#" + i).oninput = calc); calc(); }
  };
  $$("[name=coordSis]").forEach(r => r.onchange = coordBox); coordBox();
  const galBox = () => {
    $("#galBox").innerHTML = `<table><tr><th>Código</th><th>Tipo de galpón</th><th>Área útil m²</th><th>Exterior / patio m²</th><th>Bebederos</th><th>Comederos</th><th>Grupo etario</th><th>Edad</th><th>Aves</th><th></th></tr>
      ${base.galpones.map((g, i) => `<tr>${[["cod", "text"], ["tipo", "sel"], ["area", "number"], ["ext", "number"], ["beb", "number"], ["com", "number"], ["grupo", "text"], ["edad", "number"], ["aves", "number"]].map(([k, t]) =>
        `<td>${t === "sel" ? `<select data-g="${i}:${k}"><option value="">—</option>${Object.entries(TIPOS_GALPON).map(([a, b]) => `<option value="${a}" ${g.tipo === a ? "selected" : ""}>${b[0]}</option>`).join("")}</select>` : `<input data-g="${i}:${k}" type="${t}" value="${esc(k === "ext" ? (g.ext || g.patio || "") : g[k])}" style="min-width:${t === "text" ? 110 : 70}px">`}</td>`).join("")}
      <td><button type="button" class="btn ghost sm" data-act="delGalpon" data-i="${i}">✕</button></td></tr>`).join("")}</table>`;
    $$("[data-g]").forEach(el => el.oninput = el.onchange = () => { const [i, k] = el.dataset.g.split(":"); base.galpones[i][k] = el.type === "number" ? Number(el.value) : el.value; tipoBox(); });
    tipoBox();
  };
  const tipoBox = () => { const t = totalAves(base); $("#tipoBox").innerHTML = `<div class="alert ${t >= 200 ? "ok" : "info"}">Total de aves: <b>${int(t)}</b> → tipo de predio calculado: <b>${tipoPredio(base)}</b> (≥ 200 aves = granja avícola · ≤ 199 = traspatio).</div>`; };
  window._galBox = galBox; galBox();
  $("#fU").onsubmit = e => {
    e.preventDefault();

      capacidad: Number(f.capacidad.value), gab: f.gab.value === "1", gabVence: f.gabVence.value, depto: f.depto.value, mun: f.mun.value, vereda: f.vereda.value.trim(), dir: f.dir.value, indic: f.indic.value, coordSis: base.coordSis };
    if (data.coordSis === "GEO") { data.lat = $("#cLat").value ? Number($("#cLat").value) : null; data.lon = $("#cLon").value ? Number($("#cLon").value) : null;
      if (data.lat != null && (data.lat < -4.3 || data.lat > 13.5 || data.lon < -82 || data.lon > -66.8)) errs.push("Las coordenadas están fuera de Colombia."); }
    data.especies = $$("[name=sis]:checked").map(c => ({ sis: c.value, pastoreo: c.value === "PONEDORA_PISO" && f.pastoreo.checked }));
    if (!data.nombre || !data.vereda || !data.capacidad) errs.push("Nombre, vereda y capacidad instalada son obligatorios.");
    if (!data.especies.length) errs.push("Asocie al menos una especie y sistema productivo.");
    if (data.gab && !data.gabVence) errs.push("Si tiene GAB, registre su vigencia.");
    if (totalAves(base) >= 200 && !data.rt) errs.push("En granja avícola el responsable técnico es obligatorio.");
    if (S.unidades.some(x => x.id !== base.id && x.nombre.toLowerCase() === data.nombre.toLowerCase() && x.mun === data.mun && x.propietario === data.propietario)) errs.push("Ya existe una unidad con el mismo nombre, municipio y propietario.");
    if (errs.length) { $("#fMsg").innerHTML = `<div class="alert err">${errs.join("<br>")}</div>`; window.scrollTo(0, document.body.scrollHeight); return; }
    const nUsers = S.users.length;
    data.propietario = propGuardar(own);
    Object.assign(base, data);
    if (id) { confirmarCambios(id, base, nUsers); }
    else { base.id = S.nextUnidad++; S.unidades.push(base); audit("Creó", "Unidad productiva " + base.nombre, { m: "Unidades productivas", det: [{ c: "Unidad productiva", a: "—", d: `${base.nombre} · ${base.mun}, ${base.depto} · ${int(totalAves(base))} aves · ${base.galpones.length} galpón(es)` }] }); toast("Unidad productiva registrada."); location.hash = "#/unidades/" + base.id; }
  };
}

    <tr><td><b>Suma</b></td>${["I", "II"].map(c => `<td id="sum${c}"></td>`).join("")}</tr></table>${editable ? `<br><button class="btn" data-act="savePesos">Guardar pesos</button>` : ""}<div id="pMsg"></div>`;
  if (PTAB === "niveles") body = `<p class="muted">Tabla 2 · clasificación final.</p><table><tr><th>Nivel</th><th>Desde (%)</th><th>Hasta</th></tr>${PARAMS.niveles.map((n, i) => `<tr><td>${lvl(n.min + 0.01 > 0 ? n.min + 0.01 : 0).replace(nivel(n.min + 0.01), n.n)}</td><td>${n.min}</td><td>${i === 0 ? "100" : "< " + PARAMS.niveles[i - 1].min}</td></tr>`).join("")}</table>`;
  if (PTAB === "muestreo") body = `<h3>Tabla 3 · galpones a inspeccionar</h3><table><tr><th>Capacidad instalada</th><th>Máximo de galpones</th></tr><tr><td>Menor de 50.000 aves</td><td>1</td></tr><tr><td>Más de 50.000 aves</td><td>2</td></tr></table>
    <h3 style="margin-top:16px">Reglas de muestreo (6.1 · Ilustración 2)</h3><ul class="list-clean"><li>9 puntos por galpón: extremos y centro, iniciando por la entrada más cercana.</li><li>Piso: 15 a 30 aves por punto.</li><li>Jaula: 3 a 5 jaulas (abajo, intermedio, arriba) con 10 a 20 aves en total.</li><li>Traspatio (numeral 11): se evalúan todos los corrales, priorizando las aves de mayor edad; 1 punto por cada 15 aves y 1 a 2 aves por punto (con menos de 15 aves se evalúan todas). Sin corral: mínimo 10 aves (si hay menos, todas) y todos los recursos disponibles.</li></ul>`;

/* =============================== modal y acciones =============================== */
function modal(title, body, foot) {
  closeModal();
  const m = document.createElement("div"); m.className = "modal-bg"; m.id = "modal";
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><header><h2>${title}</h2><button class="btn ghost" data-act="close" aria-label="Cerrar">✕</button></header><div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  m.onclick = e => { if (e.target === m) closeModal(); };
  document.body.appendChild(m);
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }

  close: closeModal,
  logout: () => { audit("Cerró sesión", fullName(userById(SES.id)), { m: "Acceso" }); SES = null; location.hash = "#/login"; },

      <div class="field"><label>Descripción *</label><textarea id="raDet" rows="3" placeholder="Indique el soporte o la situación actual (mínimo 10 caracteres)."></textarea><span class="hint" id="raErr" style="color:var(--vino);display:none">Escriba una descripción de al menos 10 caracteres.</span></div>`,

      if (ind.u === "Punto") return `1 puñado de cama en cada uno de los 9 puntos del galpón ${gk}; cada casilla es un punto.`;
      if (RES_U[ind.u]) { const [pl, f, rel] = RES_U[ind.u]; return `En cada uno de los 9 puntos se revisan los 4 o 5 ${pl} más cercanos (jaula: los de cada jaula); cada casilla es la calificación del punto. El total del inventario (${int(g[f])} ${pl}) no se revisa uno a uno: se usa en ${rel}.`; }
      if (ind.u === "Nidal") return `El nidal más cercano a cada uno de los 9 puntos del galpón ${gk}; cada casilla es un punto.`;
      if (ind.u === "Jaula") return `3 a 5 jaulas por punto (nivel bajo, intermedio y alto) en los 9 puntos; cada casilla es la calificación del punto.`;
    }
    if (k === "ratio") return `Sin muestreo: usa los totales del inventario del galpón ${gk} (${int(g.aves)} aves y ${int(ind.what === "bebedero" ? g.beb : g.com)} ${ind.what}s) frente a la referencia del fabricante.`;
    if (k === "dens_jaula") return `3 jaulas de muestra: área de cada jaula y número de aves alojadas.`;
    if (k.startsWith("dens")) return `Sin muestreo: usa el total de aves y el área del galpón ${gk} registrados en el inventario${ev.pastoreo ? " (incluye corrales exteriores)" : ""}.`;
    if (k === "pct") return jaula ? "Conteo de aves con el comportamiento antes de abrir cada jaula de la muestra." : "Estimación visual del % de aves con el comportamiento en el centro y los extremos del galpón, antes de cualquier otra medición.";

    if (G.n < 15) return `Numeral 11: ${G.n} ${lab} en ${corr} (menos de 15) → se evalúan todas: ${G.n} aves; cada casilla es un ave.`;
    return `Numeral 11: ${G.n} ${lab} en ${corr} → ${G.puntos} puntos de inspección (1 por cada 15 aves) con 1 a 2 aves cada uno → ${G.aves} aves, priorizando las de mayor edad; cada casilla es un ave.`;
  }

  if (k === "grid" && ind.u === "Punto") return `1 puñado de cama por punto de inspección de ${corr}: ${G.puntos} punto(s) (1 por cada 15 aves).`;
  if (k === "grid" && ind.u === "Nidal") return G.corral ? `El nidal más cercano a cada punto de inspección: ${G.puntos} nidal(es).` : `Sin corral: los nidales del lugar donde ponen las gallinas, según indique el productor.`;
  if (ind.id === "13.1") return G.corral ? `1 hoja centinela en el centro de ${corr}, colocada al inicio y retirada al final de la visita.` : `Sin corral (${corr}): se califica automáticamente con 2 puntos (13.1).`;

/* ---------- tamaño de la muestra por grupo (traspatio) y puntos por unidad ---------- */
function unitCount(ind, ev, gk) {
  if (ev.cap === "I") return ind.cnt;
  const G = grupoOf(ev, gk);
  if (ind.u === "Ave" || ind.k === "cc") return Math.max(1, G.aves);
  if (ind.u === "Bebedero") return Math.max(1, G.beb);
  if (ind.u === "Comedero") return Math.max(1, G.com);
  return Math.max(1, G.puntos);
}
function unitPts(ind, r, gk) {
  if (ind.k === "cc") { const map = gk === "PON" ? { 1: 0, 2: 2, 3: 2, 4: 1, 5: 0 } : { 1: 0, 2: 1, 3: 2, 4: 2, 5: 0 }; return r.units.filter(x => x != null).map(x => map[x]); }
  return r.units.filter(x => x != null);
}
function resultadoPorGrupo(ev) {
  return ev.grupos.map(G => {
    const gr = {};
    ["MBA", "MBR"].forEach(g => {
      const v = indsOf(ev).filter(i => i.g === g && appliesG(i, ev, G.id)).map(i => score(i, getR(ev, G.id, i), ev, G.id).pts).filter(x => x != null).map(x => x / 2 * 100);
      gr[g] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    });
    const total = ["MBA", "MBR"].reduce((t, g) => t + (gr[g] || 0) * PARAMS.pesos.II[g] / 100, 0);
    return { G, gr, total };
  });
}

/* ---------- 3 · historial por unidad: instantánea de cada calificación ---------- */
const FINAL = ["FINALIZADA", "VALIDADA", "CERRADA"];
function levelsOf(ind) {                      // niveles posibles (en %) de un indicador; null = continuo
  if (ind.k === "grid" || ind.k === "cc") return null;
  if (ind.k.startsWith("dens")) return [100, 0];
  if (ind.k === "check" && ind.rule === "all" && !MIN_REQ[ind.id]) return [100, 0];
  return [100, 50, 0];
}
function enrichHistorico() {     // el histórico de ejemplo solo traía totales: se le agrega el detalle por indicador
  S.historico.forEach(h => {
    if (h.det) return;
    const u = unidadById(h.unidad), sk = (u.especies.find(e => !e.sis.startsWith("TRAS")) || {}).sis;
    h.cap = sk ? "I" : "II"; h.sis = sk || "TRAS";
    const list = h.cap === "I" ? IND1.filter(i => i[SIS_KEY[h.sis]]) : IND2, pesos = PARAMS.pesos[h.cap], g0 = { ...h.g }, t0 = h.total;
    const seed0 = h.codigo.split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 100000, 7);
    let best = null;
    for (let t = 0; t < 120 && !(best && best.ok); t++) {
      const R = rnd(seed0 + t * 131), det = {}, g = { ...g0 };
      ["MBA", "MBR", "MBG"].forEach(gr => {
        const L = list.filter(i => i.g === gr); if (!L.length || !pesos[gr] || !g0[gr]) return;
        const m = g0[gr], lev = L.map(levelsOf);
        const v = L.map((i, k) => { const ls = lev[k]; if (!ls) return Math.max(0, Math.min(100, Math.round(m + (R() - .5) * 50)));
          if (R() * 100 < m) return ls.includes(50) && R() < .2 ? 50 : 100; return ls.includes(50) && R() < .35 ? 50 : 0; });
        for (let it = 0; it < 600; it++) {
          const d = m - avg(v); if (Math.abs(d) <= 1) break;
          const k = Math.floor(R() * L.length), old = v[k]; let nv = old;
          if (!lev[k]) nv = Math.max(0, Math.min(100, old + Math.sign(d) * Math.min(5, Math.abs(d) * L.length)));
          else { const ls = lev[k], c = ls.indexOf(old), nx = d > 0 ? ls[c - 1] : ls[c + 1]; if (nx != null) nv = nx; }
          v[k] = nv; if (Math.abs(m - avg(v)) >= Math.abs(d)) v[k] = old;
        }
        L.forEach((i, k) => det[i.id] = v[k]); g[gr] = Math.round(avg(v) * 10) / 10;
      });
      const total = Math.round(["MBA", "MBR", "MBG"].reduce((s, gr) => s + (pesos[gr] ? (g[gr] || 0) * pesos[gr] / 100 : 0), 0) * 10) / 10;
      best = { det, g, total, ok: nivel(total) === nivel(t0) && Math.abs(total - t0) <= 1.2 };
    }
    h.det = best.det; h.g = best.g; h.total = best.total;
  });
}
function missFromPct(ind, pct) {

  const mn = MIN_REQ[ind.id] || ind.min;
  return pct >= 50 && mn ? ind.crit.filter((c, i) => !mn.includes(i)) : ind.crit.slice();
}
function snapOfHist(h) {
  const items = Object.entries(h.det).map(([id, pct]) => { const ind = indById(id); return { ind, pct, det: "", miss: missFromPct(ind, pct) }; });
  return { codigo: h.codigo, unidad: h.unidad, fecha: h.fecha, cap: h.cap, sis: h.sis, sisLab: h.cap === "I" ? SISTEMAS[h.sis] : "Traspatio", total: h.total, g: h.g, items, src: "hist", estado: "CERRADA" };
}
function snapOfEv(ev) {
  const r = resultado(ev);
  const items = r.inds.filter(x => x.pct != null).map(x => {
    const rr = x.ind.k === "check" ? getR(ev, "U", x.ind) : null;
    return { ind: x.ind, pct: x.pct, det: x.sc.map(s => s.det).filter(Boolean).join(" · "), miss: rr ? x.ind.crit.filter((c, i) => !rr.checks[i]) : [], doc: rr && rr.doc };
  });

function unitSnaps(uid) {
  const h = S.historico.filter(x => x.unidad === uid).map(snapOfHist);
  const e = S.evaluaciones.filter(x => x.unidad === uid && FINAL.includes(x.estado)).map(snapOfEv);

function prevSnap(ev) {
  if (!(ev.id in PREVC)) { const sn = unitSnaps(ev.unidad).filter(s => s.codigo !== ev.codigo && s.fecha <= ev.fecha); PREVC[ev.id] = sn.length ? sn[sn.length - 1] : null; }

}

/* ---------- 4 · cantidades concretas para cada finca ---------- */

/* ---------- medidas en el animal por punto (Ilustración 2 · numeral 6.1) ---------- */
function PP_RANGO(ev) { return ev.sis === "PONEDORA_JAULA" ? [10, 20] : [15, 30]; }        // aves por punto
const ppVacio = v => v === "" || v == null;
function ppEstado(q, ev) {
  const [a, b] = PP_RANGO(ev), n = Number(q.n), c = [q.c2, q.c1, q.c0];

  if (!(n >= a && n <= b)) return { ok: false, err: `Revise entre ${a} y ${b} aves por punto` };
  const s = c.reduce((t, x) => t + Number(x), 0);
  if (s !== n) return { ok: false, err: `La suma (${s}) no coincide con las ${n} aves revisadas` };
  return { ok: true };
}

}
function ppHtml(ev, ind, r, key, ed) {

  const inp = (i, f, v) => `<input type="number" min="0" max="${b}" data-pp="${key}:${i}:${f}" value="${ppVacio(v) ? 0 : v}" ${dis} aria-label="Punto ${i + 1} · ${f}">`;

/* ---------- 5 · trazabilidad de pendientes ---------- */
function resueltos(uid) {          // hallazgos que pasaron a 100 % entre una calificación y la siguiente

    const tipo = x.doc === "PENDIENTE" ? ["Documento por aportar", "t-warn"] : x.pct < 50 ? ["Incumplimiento", "t-err"] : x.ind.g === "MBG" ? ["Gestión documental", "t-info"] : ["Obligatorio incompleto", "t-warn"];
    const ra = R[x.ind.id] && R[x.ind.id].n ? R[x.ind.id] : { n: 1, desde: snap.fecha, cod: snap.codigo, dias: -diasHasta(snap.fecha) }, prio = prioDe(x.ind, x.pct, ra.n > 1);
    const rec = recText(x.ind, x, snap); if (x.doc === "PENDIENTE") rec.acciones.unshift("Aportar el documento de soporte que quedó pendiente en la visita.");
    return { x, tipo: tipo[0], cls: tipo[1], prio, ra, rec };

}

  (x.miss || []).forEach(c => acciones.push("Completar la condición pendiente: " + c + "."));
  R.forEach(r => r.a.slice(0, R.length > 1 ? 1 : cant.acc.length ? 2 : 3).forEach(a => acciones.push(a)));
  if (!acciones.length) acciones.push("Llevar el indicador a: " + ind.p2 + ".");
  const base = x.pct >= 75 ? `Cerca de la meta (${fmt(x.pct, 0)} %): algunas unidades revisadas quedaron en 1 punto · ${ind.p1}`
    : x.pct >= 50 ? `Nivel intermedio (${fmt(x.pct, 0)} %) · ${ind.p1}` : `Nivel deficiente (${fmt(x.pct, 0)} %) · ${ind.p0}`;
  return { meta: metaText(ind), actual: (x.det ? x.det + " → " : "") + base, sit: cant.sit, fuente: cant.fuente, acciones };

    const imp = impOf(x.ind), obl = imp >= PARAMS.oblDesde, ra = R[x.ind.id] || { n: 1 }, reinc = ra.n > 1;
    const impacto = (100 - x.pct) / cnt[x.ind.g] * pesos[x.ind.g] / 100, imp1 = x.pct < 50 ? (50 - x.pct) / cnt[x.ind.g] * pesos[x.ind.g] / 100 : 0;
    const prio = prioDe(x.ind, x.pct, reinc);
    return { ...x, imp, obl, reinc, ra, impacto, imp1, gNuevo: Math.min(100, (snap.g[x.ind.g] || 0) + (100 - x.pct) / cnt[x.ind.g]),
      score: impacto * [1, 1.25, 1.5, 2][imp - 1], prio, rec: recText(x.ind, x, snap) };

}

  if (act && menuHas("seguimiento")) out.push(iaBtn("seguir", "Seguimiento", { act: "segU", id: u.id }));
  return out.join("");
}

/* tablero Kanban: la columna depende del estado real de la evaluación de cada unidad (las tarjetas no se arrastran) */

function segInfo(u) {

  const iconos = [iaBtn("ficha", "Ver ficha", { href: "#/unidades/" + u.id }), iaEvaluar(u),

function vSeguimiento() {

    EVAL: (a, b) => (a.last ? a.last.fecha : "").localeCompare(b.last ? b.last.fecha : ""),

      l ? iaBtn("plan", "Plan de mejora", { href: planHref(l) }) : "", iaBtn("historial", "Historial de evaluaciones", { act: "histU", id: r.u.id }), iaBtn("ficha", "Ver ficha de la unidad", { href: "#/unidades/" + r.u.id })].join("");

      <td>${r.ab ? `${esc(r.ab.codigo)} ${estTag(r.ab.estado)}<div class="tiny muted">Inspector: ${esc(fullName(userById(r.ab.insp)))}</div>${progHtml(r.ab)}` : '<span class="tiny muted">Ninguna</span>'}</td>

/* ---------- parametrización: importancia, carácter y prioridad ---------- */
function paramImportancia(editable) {
  const dis = editable ? "" : "disabled";

    <td>${editable ? `<select data-imp="${i.id}">${[4, 3, 2, 1].map(n => `<option value="${n}" ${impOf(i) === n ? "selected" : ""}>${n} · ${IMP_NIV[n].n}</option>`).join("")}</select>` : impTag(i)}</td><td>${oblTag(i)}</td>

  const ord = L => L.slice().sort((a, b) => ({ MBA: 0, MBR: 1, MBG: 2 })[a.g] - ({ MBA: 0, MBR: 1, MBG: 2 })[b.g] || String(a.cod || a.id).localeCompare(String(b.cod || b.id), "es", { numeric: true }));
  return `<div class="alert warn"><b>Propuesta del proyecto.</b> La metodología puntúa cada indicador de 0 a 2 y no define por sí sola una lista de indicadores “obligatorios”. Esta clasificación se basa en el riesgo para el ave y en los requisitos legales de base, y debe validarse contra la normativa vigente. ${editable ? "Como administrador puede ajustarla; cada cambio queda en el control de cambios y los planes de mejora se recalculan." : "Solo el administrador puede modificarla."}</div>
    <h3>1. Escala de importancia</h3><table><tr><th>Nivel</th><th>Criterio</th><th>Carácter</th></tr>${[4, 3, 2, 1].map(n => `<tr><td><span class="imp i${n}"><span class="dots">${"●".repeat(n)}${"○".repeat(4 - n)}</span> ${IMP_NIV[n].n}</span></td><td class="small">${esc(IMP_NIV[n].d)}</td><td>${n >= PARAMS.oblDesde ? '<span class="tag t-err">Obligatorio</span>' : '<span class="tag t-gray">No obligatorio</span>'}</td></tr>`).join("")}</table>
    <div class="field" style="max-width:380px;margin:12px 0"><label>Son de obligatorio cumplimiento los indicadores desde el nivel</label><select id="oblDesde" ${dis}>${[4, 3, 2, 1].map(n => `<option value="${n}" ${PARAMS.oblDesde === n ? "selected" : ""}>${n} · ${IMP_NIV[n].n} y superiores</option>`).join("")}</select></div>

/* ---------- motor de respuesta ---------- */
function responder(q) {
  const t = nrm(q), C = CHAT.ctx, us = visibleUnidades(), anon = SES.rol === "CONS", has = (...w) => w.some(x => t.includes(x));
  const um = anon ? null : us.find(u => nombreEn(t, u));
  if (!um && !anon) { const otra = S.unidades.find(u => !us.includes(u) && nombreEn(t, u)); if (otra) return { a: "No tiene acceso a la información de esa unidad productiva. Solo puedo responder sobre las unidades vinculadas a su perfil.", ref: "Permisos del perfil" }; }

  if (!C.u && us.length === 1 && !anon) C.u = us[0].id;
  const u = C.u ? unidadById(C.u) : null;

  if (/(mi solicitud|me van a llamar|me contacta|cuando me llaman|solicitudes de contacto|solicitudes)/.test(t)) return iaSolicitudes();

  let best = null, bs = 0;

  if (C.ind && /(cuanto sube|impacto|cuanto mejora|cuantos puntos)/.test(t)) return necesitaU(x => iaImpacto(C.ind, x));

  if (C.ind && /^(y )?(como lo hago|como hago eso|como se hace|explica(me)?( mas)?|mas detalle|que hago)$/.test(t)) return necesitaU(x => iaInd(C.ind, x));

function borrador(uid) {
  const us = visibleUnidades(), yo = userById(SES.id), u = unidadById(uid || CHAT.ctx.u || (us[0] || {}).id);
  return { uid: u.id, contacto: { granja: u.nombre, persona: fullName(yo), cel: yo.tel || "", correo: yo.correo || "", medio: "WhatsApp", dias: "Lunes a viernes", desde: "08:00", hasta: "12:00", alt: { nombre: "", cel: "" } } };
}
function iaContacto() {
  if (SES.rol === "CONS") return { a: "Como consultor externo no tiene unidades productivas vinculadas para solicitar asistencia técnica." };
  if (esTecnico()) { const n = misConsultas().filter(c => c.estado === "PENDIENTE").length; return { a: `Usted hace parte del equipo técnico. Las solicitudes de contacto de los productores están en <b>Inicio · Solicitudes de contacto</b>${n ? ` (${n} por contactar)` : ""}.`, link: { act: "irInicio", lab: "Ir a Inicio" } }; }
  if (!visibleUnidades().length) return { a: "Su perfil no tiene unidades productivas vinculadas." };
  CHAT.draft = borrador(); CHAT.editC = false;
  return { kind: "contacto", a: "Con gusto le pongo en contacto con un técnico. Estos son los datos que tengo de usted en la plataforma; confírmelos o actualícelos para que le contacte:" };
}
function iaSolicitudes() {
  const L = misConsultas().sort((a, b) => b.id - a.id);
  if (esTecnico()) return { a: L.length ? `Tiene <b>${L.filter(c => c.estado === "PENDIENTE").length}</b> por contactar de ${L.length} solicitudes:<br>${L.slice(0, 5).map(c => `• ${esc(c.contacto.granja)} · ${esc(c.contacto.persona)} · ${esc(c.contacto.cel)} · ${SOL_EST[c.estado][0]}`).join("<br>")}` : "No tiene solicitudes de contacto.", link: { act: "irInicio", lab: "Ver en Inicio" } };
  return { a: L.length ? L.map(c => { const nota = c.mensajes.filter(m => m.de !== SES.id).slice(-1)[0]; return `• ${c.fecha} · ${esc(c.contacto.granja)}: <b>${SOL_EST[c.estado][0].toLowerCase()}</b> por ${esc(fullName(userById(c.asignado)))}${nota ? `<br>&nbsp;&nbsp;Nota del técnico: ${esc(nota.t)}` : ""}`; }).join("<br>") : "No tiene solicitudes de contacto. Si quiere, escriba «quiero que me contacte un técnico».", sug: ["Quiero que me contacte un técnico"] };
}
function contactoBub(m) {
  if (m.sent) return contactoHtml(m.sent);
  const d = CHAT.draft; if (!d) return "";
  const us = visibleUnidades(), t = tecDe(unidadById(d.uid)), k = d.contacto;
  if (!CHAT.editC) return contactoHtml({ contacto: k }) + `<p class="tiny muted" style="margin:6px 0 0">Le contactará ${esc(fullName(t))} (${esc(rolDe(t).nombre.toLowerCase())}). Al confirmar autoriza el uso de estos datos para que le contacten (Ley 1581 de 2012).</p>
    <div class="bub-opts"><button class="btn sm" data-act="contactoOk">Sí, solicitar contacto</button><button class="btn sec sm" data-act="contactoEdit">Actualizar datos</button></div>`;
  return `<form id="cfForm" class="form one tec-form">
    ${us.length > 1 ? `<div class="field"><label>Unidad productiva</label><select id="cfU">${us.map(u => `<option value="${u.id}" ${u.id === d.uid ? "selected" : ""}>${esc(u.nombre)}</option>`).join("")}</select></div>` : ""}
    <div class="field"><label>Nombre completo</label><input id="cfP" value="${esc(k.persona)}"></div>
    <div class="grid2"><div class="field"><label>Celular</label><input id="cfC" type="tel" value="${esc(k.cel)}"></div><div class="field"><label>Correo</label><input id="cfE" type="email" value="${esc(k.correo)}"></div></div>
    <div class="field"><label>Medio preferido</label><div class="radio-row">${["Llamada", "WhatsApp", "Correo"].map(x => `<label><input type="radio" name="cfM" value="${x}" ${k.medio === x ? "checked" : ""}> ${x}</label>`).join("")}</div></div>
    <div class="field"><label>Horario de atención</label><select id="cfD">${["Lunes a viernes", "Lunes a sábado", "Todos los días", "Solo fines de semana"].map(x => `<option ${k.dias === x ? "selected" : ""}>${x}</option>`).join("")}</select>
      <div class="grid2" style="margin-top:6px"><label class="tiny">Desde<input id="cfH1" type="time" value="${esc(k.desde)}"></label><label class="tiny">Hasta<input id="cfH2" type="time" value="${esc(k.hasta)}"></label></div></div>
    <div class="field"><label>Contacto adicional (opcional)</label><div class="grid2"><input id="cfAN" placeholder="Nombre de la persona" value="${esc(k.alt.nombre)}"><input id="cfAC" type="tel" placeholder="Teléfono" value="${esc(k.alt.cel)}"></div></div>
    <div id="cfMsg"></div><div class="btn-row"><button type="button" class="btn sec sm" data-act="contactoCancel">Cancelar</button><button class="btn sm">Guardar datos</button></div></form>`;
}
function guardarBorrador(p) {
  const v = id => ($(id, p) ? $(id, p).value.trim() : ""), errs = [], d = CHAT.draft;
  const uid = $("#cfU", p) ? Number(v("#cfU")) : d.uid, u = unidadById(uid);
  const k = { granja: u.nombre, persona: v("#cfP"), cel: v("#cfC"), correo: v("#cfE"), medio: $("[name=cfM]:checked", p).value, dias: v("#cfD"), desde: v("#cfH1"), hasta: v("#cfH2"), alt: { nombre: v("#cfAN"), cel: v("#cfAC") } };
  if (!k.persona) errs.push("Escriba su nombre completo.");
  if (!/^3\d{9}$/.test(k.cel.replace(/\D/g, ""))) errs.push("El celular debe tener 10 dígitos y empezar por 3.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(k.correo)) errs.push("Revise el correo.");
  if (!k.desde || !k.hasta || k.desde >= k.hasta) errs.push("La hora final debe ser posterior a la inicial.");
  if (k.alt.cel && !/^\d{7,10}$/.test(k.alt.cel.replace(/\D/g, ""))) errs.push("El teléfono adicional debe tener entre 7 y 10 dígitos.");
  if (k.alt.cel && !k.alt.nombre) errs.push("Escriba el nombre del contacto adicional.");
  if (errs.length) { $("#cfMsg", p).innerHTML = `<div class="alert err small">${errs.join("<br>")}</div>`; return; }
  CHAT.draft = { uid, contacto: k }; CHAT.editC = false; renderChat();
}
function enviarSolicitud() {
  const d = CHAT.draft, t = tecDe(unidadById(d.uid)), id = S.consultas.reduce((a, c) => Math.max(a, c.id), 0) + 1;
  const c = { id, de: SES.id, unidad: d.uid, tema: "Solicitud de contacto", fecha: stamp(), asignado: t.id, estado: "PENDIENTE", contacto: d.contacto, mensajes: [] };
  S.consultas.push(c); const m = CHAT.msgs.find(x => x.kind === "contacto" && !x.sent); if (m) m.sent = c;
  S.notifs.unshift({ t: `Solicitud de contacto técnico: ${d.contacto.granja} · ${d.contacto.persona}`, d: today().slice(8, 10) + "/" + today().slice(5, 7) });
  audit("Solicitó contacto técnico", `${d.contacto.granja} · ${d.contacto.persona}`, { m: "Asistente IA" }); CHAT.draft = null;
  CHAT.msgs.push({ de: "ia", t: `Listo. Su solicitud quedó registrada: <b>${esc(fullName(t))}</b> le contactará por ${esc(d.contacto.medio.toLowerCase())} ${esc(d.contacto.dias.toLowerCase())}, de ${esc(d.contacto.desde)} a ${esc(d.contacto.hasta)}. Puede preguntarme «¿cómo va mi solicitud?» cuando quiera.`, sug: ["¿Cómo va mi solicitud?", "¿Cómo voy?"] });
  renderChat();
}
/* ---------- solicitudes en el Inicio (equipo técnico y quien las pidió) ---------- */
function solicitudesCard() {
  if (!SES || SES.rol === "CONS") return "";
  const L = misConsultas().sort((a, b) => b.id - a.id); if (!L.length) return "";
  const tec = esTecnico();
  return `<div class="card"><div class="card-head"><h3>${tec ? "Solicitudes de contacto técnico" : "Mis solicitudes de contacto técnico"}</h3><span class="tag t-warn">${L.filter(c => c.estado === "PENDIENTE").length} por contactar</span></div>
    <div class="sol-grid">${L.map(c => { const nota = c.mensajes.slice(-1)[0];
      return `<div>${contactoHtml(c)}<div class="tiny muted" style="margin-top:4px">Solicitada el ${c.fecha || "—"} · asignada a ${esc(fullName(userById(c.asignado)))}${nota ? ` · nota: ${esc(nota.t)}` : ""}</div>
        ${tec && c.estado !== "RESUELTA" ? `<div class="btn-row" style="margin-top:6px"><button class="btn sec sm" data-act="solEstado" data-id="${c.id}" data-e="CONTACTADO">Registrar contacto</button><button class="btn ghost sm" data-act="solEstado" data-id="${c.id}" data-e="RESUELTA">Marcar como resuelta</button></div>` : ""}</div>`; }).join("")}</div></div>`;
}
function chatHtml() {
  const P = PERFIL_IA[SES.rol];
  const head = `<header><img src="${ICO_PV}" alt=""><div><b>Asistente PlumaViva</b><small>Bienestar y salud de aves de corral y de traspatio · perfil ${P.rol}</small></div></header>`;
  const lastBot = CHAT.msgs.slice().reverse().find(m => m.de === "ia"), sug = (lastBot && lastBot.sug && lastBot.sug.length ? lastBot.sug : P.sug);
  const pideTec = SES.rol !== "CONS" && !esTecnico();
  return head + `<div class="chat-log" id="chatLog">${CHAT.msgs.length ? "" : `<div class="bot"><div class="bub">Hola, ${esc(userById(SES.id).nombres.split(" ")[0])}. Le ayudo con sus evaluaciones, hallazgos, recomendaciones y planes de mejora, y con dudas de bienestar y salud de las aves. Respondo con ${esc(P.puede)}. Puede hacer preguntas de seguimiento, como «¿cómo lo hago?» o «ver más».${pideTec ? " Si prefiere hablar con un técnico, escríbamelo." : ""}</div></div>`}
    ${CHAT.msgs.map(m => m.de === "yo" ? `<div class="me"><div class="bub">${esc(m.t)}</div></div>` : `<div class="bot"><div class="bub">${m.t}${m.kind === "contacto" ? contactoBub(m) : ""}${m.opts ? `<div class="bub-opts">${m.opts.map(o => `<button class="btn sec sm" data-act="chatAsk" data-q="${esc(o.q)}">${esc(o.lab)}</button>`).join("")}</div>` : ""}${m.ref ? `<small class="ref">Fuente: ${esc(m.ref)}</small>` : ""}
      ${m.link ? `<button class="btn sec sm" data-act="${m.link.act}" data-id="${m.link.id || ""}">${esc(m.link.lab)}</button>` : ""}${m.tecnico && pideTec ? ` <button class="btn sm" data-act="chatAsk" data-q="Quiero que me contacte un técnico">Que me contacte un técnico</button>` : ""}</div></div>`).join("")}</div>
    <div class="chat-sug">${sug.map(x => `<button data-act="chatAsk" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <form id="chatForm" class="chat-in"><input id="chatTxt" placeholder="Escriba su pregunta…" autocomplete="off" aria-label="Pregunta"><button class="btn sm">Enviar</button></form>
    <p class="chat-note">Respuestas simuladas en el prototipo con la metodología, la parametrización y los datos que su perfil puede ver. La conexión con la API de IA se hará en una etapa posterior.</p>`;
}
function renderChat() {
  const fab = $("#chatFab"), p = $("#chatPanel"); if (!fab || !SES) return;
  const pend = misConsultas().filter(c => esTecnico() ? c.estado === "PENDIENTE" : c.nuevaRespuesta).length;
  fab.innerHTML = CHAT.open ? "✕" : `<img src="${ICO_PV}" alt=""><span>Asistente IA</span>${pend ? `<i class="chat-badge">${pend}</i>` : ""}`;
  fab.title = CHAT.open ? "Cerrar el asistente" : "Abrir el asistente de IA";
  p.classList.toggle("hidden", !CHAT.open);
  if (!CHAT.open) return;
  if (!esTecnico()) misConsultas().forEach(c => c.nuevaRespuesta = false);
  p.innerHTML = chatHtml();
  const log = $("#chatLog", p); if (log) log.scrollTop = log.scrollHeight;
  const f = $("#chatForm", p); if (f) f.onsubmit = e => { e.preventDefault(); const v = $("#chatTxt", p).value.trim(); if (v) preguntar(v); };
  const cf = $("#cfForm", p); if (cf) cf.onsubmit = e => { e.preventDefault(); guardarBorrador(p); };
  const inp = $("#chatTxt", p); if (inp && CHAT.focus && !cf) inp.focus();
}
function preguntar(q) {
  CHAT.msgs.push({ de: "yo", t: q });
  let r; try { r = responder(q); } catch (err) { console.error(err); r = { a: "No pude procesar esa pregunta. Intente escribirla de otra forma.", tecnico: true }; }
  CHAT.msgs.push({ de: "ia", t: r.a, ref: r.ref, link: r.link, tecnico: r.tecnico, sug: r.sug, opts: r.opts, kind: r.kind });
  CHAT.focus = true; renderChat();
}
Object.assign(ACT, {
  chatAsk: el => { CHAT.open = true; preguntar(el.dataset.q); },
  contactoOk: () => { if (CHAT.draft) enviarSolicitud(); },
  contactoEdit: () => { CHAT.editC = true; renderChat(); },
  contactoCancel: () => { CHAT.editC = false; renderChat(); },
  solEstado: el => {
    const c = S.consultas.find(x => x.id === Number(el.dataset.id)), e = el.dataset.e;
    modal(e === "RESUELTA" ? "Marcar solicitud como resuelta" : "Registrar el contacto", `${contactoHtml(c)}<div class="field" style="margin-top:10px"><label>Nota para el productor *</label><textarea id="solNota" rows="3" placeholder="${e === "RESUELTA" ? "Ej.: se resolvió en la visita del martes" : "Ej.: lo llamé; quedamos en visitar el galpón el jueves"}"></textarea></div><div id="solMsg"></div>`,
      `<button class="btn sec" data-act="close">Cancelar</button><button class="btn" id="solOk">Guardar</button>`);
    $("#solOk").onclick = () => { const n = $("#solNota").value.trim(); if (!n) { $("#solMsg").innerHTML = '<div class="alert err small">Escriba la nota.</div>'; return; }
      c.mensajes.push({ de: SES.id, t: n, fecha: stamp() }); c.estado = e; c.nuevaRespuesta = true;
      audit(e === "RESUELTA" ? "Cerró solicitud técnica" : "Registró contacto técnico", `${c.contacto.granja} · ${c.contacto.persona}`, { m: "Asistente IA" });
      S.notifs.unshift({ t: `El técnico ${e === "RESUELTA" ? "resolvió" : "registró el contacto de"} su solicitud: ${c.contacto.granja}`, d: today().slice(8, 10) + "/" + today().slice(5, 7) });
      closeModal(); toast("Solicitud actualizada."); keepRoute(); };
  },
  irInicio: () => { location.hash = "#/inicio"; },
  irUnidad: el => { UTAB = "resumen"; const h = "#/unidades/" + el.dataset.id; if (location.hash === h) route(); else location.hash = h; },
  irPlan: el => { UTAB = "plan"; const h = "#/unidades/" + el.dataset.id; if (location.hash === h) route(); else location.hash = h; },
  irEvals: () => { location.hash = "#/evaluaciones"; }
});

seedUnidadesGrandes();
normDocs();
seedEvals();
initV4();
</script>
<script>route();</script>
